<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>En Vivo - Torneo San José del Gacal</title>
  <link rel="stylesheet" href="estilos.css">

  <style>
    .live-container {
      max-width: 850px;
      margin: 40px auto;
      padding: 25px;
      text-align: center;
      background: #111;
      color: white;
      border-radius: 15px;
    }

    .live-container h1 {
      color: #39e75f;
    }

    .live-status {
      color: #ff4545;
      font-weight: bold;
      margin: 20px 0;
    }

    .social-button {
      display: inline-block;
      padding: 15px 25px;
      margin: 12px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      font-size: 17px;
      transition: 0.2s;
    }

    .social-button:hover {
      transform: scale(1.04);
    }

    .tiktok-button {
      background: #00f2ea;
      color: #111;
    }

    .facebook-button {
      background: #1877f2;
      color: white;
    }

    .live-info {
      color: #ccc;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Torneo Relámpago San José del Gacal</h1>
  </header>

  <main class="live-container">

    <h1>📺 TRANSMISIÓN EN VIVO</h1>

    <p class="live-status">
      🔴 SIGUE NUESTROS PARTIDOS
    </p>

    <p>
      Disfruta las transmisiones y novedades
      del Torneo Relámpago San José del Gacal.
    </p>

    <!-- BOTÓN TIKTOK -->
    <a
      class="social-button tiktok-button"
      href="https://www.tiktok.com/@NOMBRE_DE_USUARIO"
      target="_blank"
      rel="noopener noreferrer">
      🎵 VER EN TIKTOK
    </a>

    <!-- BOTÓN FACEBOOK -->
    <a
      class="social-button facebook-button"
      href="https://www.facebook.com/Relámpago-san-jose-del-gacal"
      target="_blank"
      rel="noopener noreferrer">
      📘 VER EN FACEBOOK
    </a>

    <p class="live-info">
      Entra a nuestras redes sociales para
      encontrar las transmisiones del torneo.
    </p>

  </main>

</body>
</html>
